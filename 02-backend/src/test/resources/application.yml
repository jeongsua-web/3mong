spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: TestHikariPool
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-used-in-production-0123456789
    expiration-ms: 86400000

google:
  client-id: test-google-client-id

openai:
  api-key: ""
  model: gpt-4o-mini

# sentry:
#   dsn:

logging:
  level:
    com.fluento: DEBUG
    org.hibernate.SQL: DEBUG
